    <meta charset="UTF-8">

    <title>OUIDROP - Trombinoscope</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Couleurs extraites de la charte graphique OUIDROP */
            --primary: #20294E;       /* Bleu Nuit */
            --primary-light: #82BEE9; /* Bleu Clair */
            --success: #43B38A;       /* Vert */
            --danger: #EC7C7C;        /* Rouge/Corail */
            --warning: #DDDABF;       /* Beige/Sable */
            --dark: #000000;          /* Noir */
            --light: #f8fafc;
            --gray: #cbd5e1;
        }

        body {
            /* Utilisation de la typographie officielle */
            font-family: 'Saira Condensed', system-ui, sans-serif;
            background-color: var(--light);
            color: var(--dark); 
            margin: 0; 
            padding: 20px; 
            display: flex;
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
        }

        /* --- EN-TÊTE OUIDROP --- */
        header { text-align: center; margin-bottom: 25px; }
        h1 { 
            margin: 0; 
            font-size: 3rem; 
            font-weight: 700; 
            color: var(--primary); 
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .baseline { 
            margin: 0; 
            font-size: 1.2rem; 
            color: var(--dark); 
            letter-spacing: 2px;
        }
        .subtitle { 
            color: #64748b; 
            margin-top: 10px; 
            font-size: 1.1rem;
        }

        .container {
            background: white; 
            padding: 30px; 
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(32, 41, 78, 0.1); /* Ombre aux tons Bleu Nuit */
            width: 100%; 
            max-width: 600px;
        }

        /* --- MENU --- */
        .mode-list { display: flex; flex-direction: column; gap: 15px; }
        .mode-btn {
            background: white; 
            border: 2px solid var(--primary); 
            padding: 15px;
            border-radius: 8px; 
            cursor: pointer; 
            display: flex; 
            justify-content: space-between;
            align-items: center; 
            transition: 0.2s; 
            text-align: left;
            font-family: 'Saira Condensed', sans-serif;
        }
        .mode-btn:hover { 
            background: var(--primary-light); 
            color: white;
            border-color: var(--primary-light);
            transform: translateY(-2px); 
        }
        .mode-btn:hover strong, .mode-btn:hover small { color: white; }
        .mode-btn strong { display: block; font-size: 1.3rem; color: var(--primary); }
        .mode-btn small { color: #64748b; font-size: 1rem; }
        .high-score { 
            background: var(--warning); 
            color: var(--dark);
            padding: 5px 12px; 
            border-radius: 20px; 
            font-weight: 600; 
            font-size: 1rem;
        }

        /* --- JEU --- */
        .hidden { display: none !important; }
        #game-header { 
            display: flex; 
            justify-content: space-between; 
            margin-bottom: 20px; 
            font-weight: 600; 
            font-size: 1.3rem;
            color: var(--primary);
        }
        
        .photo-container {
            width: 160px; height: 160px; margin: 0 auto 20px auto; border-radius: 50%;
            overflow: hidden; border: 4px solid var(--primary); background-color: #ddd;
        }
        .photo-container img { width: 100%; height: 100%; object-fit: cover; }
        
        .question-text { text-align: center; font-size: 1.4rem; margin-bottom: 20px; font-weight: 600; }

        /* Grilles et Inputs */
        .grid-qcm { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px;}
        .grid-1-col { grid-template-columns: 1fr; }
        .btn-option {
            background: white; border: 2px solid var(--gray); padding: 12px; border-radius: 8px;
            cursor: pointer; font-size: 1.1rem; transition: 0.2s; font-family: 'Saira Condensed', sans-serif;
        }
        .btn-option:hover:not(:disabled) { border-color: var(--primary-light); background: #f0f7ff; }
        .btn-option.selected { background: var(--primary); color: white; border-color: var(--primary); }
        .btn-option.correct { background: var(--success) !important; color: white; border-color: var(--success); }
        .btn-option.wrong { background: var(--danger) !important; color: white; border-color: var(--danger); }
        
        .input-group { margin-bottom: 15px; display: flex; flex-direction: column; gap: 5px; }
        .input-group label { font-weight: 600; font-size: 1rem; color: var(--primary); }
        .input-group input { 
            padding: 10px; border: 2px solid var(--gray); border-radius: 8px; 
            font-size: 1.1rem; font-family: 'Saira Condensed', sans-serif;
        }
        .input-group input:focus { border-color: var(--primary-light); outline: none; }
        .input-group input.correct { border-color: var(--success); background: #eafaf1; }
        .input-group input.wrong { border-color: var(--danger); background: #fdf2f2; }
        
        .checkbox-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; max-height: 250px; overflow-y: auto;}
        .checkbox-item { display: flex; align-items: center; gap: 10px; padding: 10px; border: 1px solid var(--gray); border-radius: 8px; cursor: pointer; font-size: 1.1rem;}
        .checkbox-item:hover { background: #f8fafc; }

        /* Multi-QCM (Mode 4) */
        .multi-group { margin-bottom: 20px; border: 1px solid var(--gray); padding: 15px; border-radius: 8px;}
        .multi-group h3 { margin-top: 0; font-size: 1.2rem; color: var(--primary); }

        .btn-action {
            background: var(--primary); color: white; border: none; padding: 12px; width: 100%;
            font-size: 1.2rem; border-radius: 8px; cursor: pointer; font-weight: 600; margin-bottom: 10px;
            font-family: 'Saira Condensed', sans-serif; letter-spacing: 1px;
        }
        .btn-action:hover { opacity: 0.9; }
        .btn-quit { background: var(--dark); }

        .feedback-area { margin-top: 15px; padding: 15px; border-radius: 8px; text-align: center; font-weight: 600; font-size: 1.2rem;}
        .feedback-area.success { background: #eafaf1; color: var(--success); }
        .feedback-area.error { background: #fdf2f2; color: var(--danger); }

        /* Cartes Multi (Modes 5 & 6) */
        .grid-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .card-person {
            border: 2px solid var(--gray); border-radius: 8px; padding: 10px; text-align: center; cursor: pointer; font-size: 1.1rem;
        }
        .card-person img { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; margin-bottom: 5px; }
        .card-person.selected { border-color: var(--primary); background: #f0f7ff; }
        .card-person.correct { border-color: var(--success); background: #eafaf1; }
        .card-person.wrong { border-color: var(--danger); background: #fdf2f2; }
        .card-person.missed { border-color: var(--warning); } 

    </style>
</head>

        ];

        // --- 3. GESTION D'ÉTAT ---
        let highScores = JSON.parse(localStorage.getItem('trombiScoresOuidrop')) || {};
        let currentMode = null;
        let questions = [];
        let currentIndex = 0;
        let scoreSession = 0;
        let maxPossibleSession = 0;

        // --- 4. UTILITAIRES ---
        // Couleur de fond par défaut pour l'avatar : Bleu Nuit Ouidrop (20294E)
        const getAvatar = (name, pic) => pic ? `./pictures/${pic}` : `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&size=160&background=20294E&color=fff`;
        const shuffle = (array) => array.sort(() => Math.random() - 0.5);
        const normalizeStr = (str) => {
            if(!str) return "";
            return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim().toLowerCase();
        };
        const formatDate = (isoString) => {
            if(!isoString) return "";
            const d = new Date(isoString);
            return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth()+1).padStart(2, '0')}`;
        };
        const getUniqueVals = (key) => [...new Set(donneesAnnuaire.map(d => d.item[key]))];

        // --- 5. INITIALISATION ---
        function initMenu() {
            document.getElementById('menu-screen').classList.remove('hidden');
            document.getElementById('game-screen').classList.add('hidden');
            
            const list = document.getElementById('mode-list');
            list.innerHTML = "";
            MODES.forEach(m => {
                const maxScore = highScores[m.id] || 0;
                list.innerHTML += `
                    <div class="mode-btn" onclick="startGame(${m.id})">
                        <div>
                            <strong>${m.title}</strong>
                            <small>${m.desc}</small>
                        </div>
                        <span class="high-score">Max: ${maxScore} pts</span>
                    </div>
                `;
            });
        }

        function startGame(modeId) {
            currentMode = MODES.find(m => m.id === modeId);
            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            document.getElementById('game-mode-title').innerText = currentMode.title;
            
            scoreSession = 0; maxPossibleSession = 0;
            questions = generateQuestionsForMode(modeId);
            currentIndex = 0;
            
            updateScoreDisplay();
            renderQuestion();
        }

        function returnToMenu() {
            if(scoreSession > (highScores[currentMode.id] || 0)) {
                highScores[currentMode.id] = scoreSession;
                localStorage.setItem('trombiScoresOuidrop', JSON.stringify(highScores));
            }
            initMenu();
        }

        // --- 6. MOTEUR DE JEU ---
        function generateQuestionsForMode(modeId) {
            let q = [...donneesAnnuaire];
            shuffle(q);
            
            if (modeId === 5) {
                const pairs = [...new Set(donneesAnnuaire.map(d => d.item.fonction + "|||" + d.item.service))];
                return pairs.map(p => ({ type: 'pair', val: p })).sort(() => Math.random() - 0.5);
            }
            if (modeId === 6 || modeId === 7) {
                return getUniqueVals('service').map(s => ({ type: 'service', val: s })).sort(() => Math.random() - 0.5);
            }
            return q;
        }

        function renderQuestion() {
            if (currentIndex >= questions.length) {
                document.getElementById('question-display').innerHTML = `<h3 style="text-align:center; color:var(--primary);">🎉 Session terminée ! Score : ${scoreSession} / ${maxPossibleSession}</h3>`;
                document.getElementById('btn-validate').classList.add('hidden');
                document.getElementById('btn-next').classList.add('hidden');
                return;
            }

            const target = questions[currentIndex];
            const display = document.getElementById('question-display');
            document.getElementById('feedback-container').classList.add('hidden');
            document.getElementById('btn-validate').classList.remove('hidden');
            document.getElementById('btn-next').classList.add('hidden');
            
            let html = "";
            let p = target.item; 

            switch (currentMode.id) {
                case 1: 
                    let optionsM1 = [p.name];
                    let autresM1 = shuffle(donneesAnnuaire.filter(d => d.item.id !== p.id).map(d => d.item.name)).slice(0,3);
                    optionsM1 = shuffle(optionsM1.concat(autresM1));
                    html = `
                        <div class="photo-container"><img src="${getAvatar(p.name, p.picture)}" alt="?"></div>
                        <div class="grid-qcm">
                            ${optionsM1.map(opt => `<button class="btn-option select-one" onclick="selectOne(this, 'm1')">${opt}</button>`).join('')}
                        </div>
                    `;
                    maxPossibleSession += 1;
                    break;

                case 2: 
                    html = `
                        <div class="photo-container"><img src="${getAvatar(p.name, p.picture)}" alt="?"></div>
                        <div class="input-group"><label>Prénom</label><input type="text" id="inp-prenom" placeholder="Saisir le prénom..."></div>
                        <div class="input-group"><label>Nom de famille</label><input type="text" id="inp-nom" placeholder="Saisir le nom..."></div>
                    `;
                    maxPossibleSession += 2;
                    break;

                case 3: 
                    html = `
                        <div class="photo-container"><img src="${getAvatar(p.name, p.picture)}" alt="?"></div>
                        <div class="grid-qcm">
                            <div class="input-group"><label>Prénom</label><input type="text" id="inp-prenom"></div>
                            <div class="input-group"><label>Nom</label><input type="text" id="inp-nom"></div>
                            <div class="input-group"><label>Fonction</label><input type="text" id="inp-fonction"></div>
                            <div class="input-group"><label>Service</label><input type="text" id="inp-service"></div>
                            <div class="input-group"><label>Naissance (JJ/MM)</label><input type="text" id="inp-date" placeholder="ex: 15/05"></div>
                        </div>
                    `;
                    maxPossibleSession += 5;
                    break;

                case 4: 
                    let optF = shuffle([p.fonction].concat(shuffle(getUniqueVals('fonction').filter(f=>f!==p.fonction)).slice(0,3)));
                    let optS = shuffle([p.service].concat(shuffle(getUniqueVals('service').filter(s=>s!==p.service)).slice(0,3)));
                    html = `
                        <div class="photo-container"><img src="${getAvatar(p.name, p.picture)}" alt="?"></div>
                        <div class="question-text">${p.name}</div>
                        <div class="multi-group">
                            <h3>Sa Fonction ?</h3>
                            <div class="grid-qcm">${optF.map(o => `<button class="btn-option sel-f" onclick="selectGroup(this, 'sel-f')">${o}</button>`).join('')}</div>
                        </div>
                        <div class="multi-group">
                            <h3>Son Service ?</h3>
                            <div class="grid-qcm">${optS.map(o => `<button class="btn-option sel-s" onclick="selectGroup(this, 'sel-s')">${o}</button>`).join('')}</div>
                        </div>
                    `;
                    maxPossibleSession += 2;
                    break;

                case 5: case 6: 
                    const isM5 = (currentMode.id === 5);
                    const title = isM5 ? target.val.split('|||').join(' - ') : target.val;
                    let options = shuffle([...donneesAnnuaire]).slice(0, 6); 
                    html = `<div class="question-text">Qui correspond à : <br><strong style="color:var(--primary-light)">${title}</strong> ?</div><div class="grid-cards">`;
                    options.forEach(d => {
                        html += `
                            <div class="card-person" data-id="${d.item.id}" onclick="this.classList.toggle('selected')">
                                <img src="${getAvatar(d.item.name, d.item.picture)}"><br><strong>${d.item.name}</strong>
                            </div>
                        `;
                    });
                    html += `</div>`;
                    let correctsInCards = options.filter(d => isM5 ? (d.item.fonction+"|||"+d.item.service === target.val) : (d.item.service === target.val)).length;
                    maxPossibleSession += (correctsInCards === 0 ? 1 : correctsInCards); 
                    display.dataset.corrects = correctsInCards;
                    break;

                case 7: 
                    const serv = target.val;
                    let listPersons = shuffle([...donneesAnnuaire]); 
                    html = `
                        <div class="question-text">Qui fait partie du service : <strong style="color:var(--primary-light)">${serv}</strong> ?</div>
                        <div class="checkbox-list">
                    `;
                    listPersons.forEach(d => {
                        html += `
                            <label class="checkbox-item">
                                <input type="checkbox" value="${d.item.id}"> ${d.item.name}
                            </label>
                        `;
                    });
                    html += `</div>`;
                    let totalCorrects = listPersons.filter(d => d.item.service === serv).length;
                    maxPossibleSession += totalCorrects;
                    display.dataset.corrects = totalCorrects;
                    break;
            }
            display.innerHTML = html;
            updateScoreDisplay();
        }

        // Fonctions UI
        function selectOne(btn) {
            document.querySelectorAll('.select-one').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
        }
        function selectGroup(btn, groupClass) {
            document.querySelectorAll('.'+groupClass).forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
        }

        // Validation
        function validateAnswer() {
            const target = questions[currentIndex];
            let ptsGained = 0;
            let feedback = "";
            let p = target.item;

            document.getElementById('btn-validate').classList.add('hidden');
            
            if (currentMode.id === 1) {
                const sel = document.querySelector('.select-one.selected');
                const btns = document.querySelectorAll('.select-one');
                if(!sel) return alert("Sélectionnez une réponse !");
                
                btns.forEach(b => {
                    b.disabled = true;
                    if(b.innerText === p.name) b.classList.add('correct');
                    else if(b === sel) b.classList.add('wrong');
                });
                
                if (sel.innerText === p.name) { ptsGained = 1; feedback = "Correct !"; }
                else { feedback = `Faux, c'était ${p.name}`; }

            } else if (currentMode.id === 2 || currentMode.id === 3) {
                const checkField = (id, trueVal) => {
                    const el = document.getElementById(id);
                    el.disabled = true;
                    if (normalizeStr(el.value) === normalizeStr(trueVal)) { el.classList.add('correct'); return 1; }
                    else {
                        el.classList.add('wrong'); 
                        el.value = el.value ? `${el.value} (Attendu: ${trueVal})` : trueVal;
                        return 0; 
                    }
                };
                
                ptsGained += checkField('inp-prenom', p.firstName);
                ptsGained += checkField('inp-nom', p.lastName);
                
                if (currentMode.id === 3) {
                    ptsGained += checkField('inp-fonction', p.fonction);
                    ptsGained += checkField('inp-service', p.service);
                    ptsGained += checkField('inp-date', formatDate(p.birthDate));
                }
                feedback = `Vous avez obtenu ${ptsGained} point(s) sur cette question.`;

            } else if (currentMode.id === 4) {
                const fSel = document.querySelector('.sel-f.selected');
                const sSel = document.querySelector('.sel-s.selected');
                if(!fSel || !sSel) return alert("Sélectionnez une fonction ET un service !");
                
                document.querySelectorAll('.btn-option').forEach(b => b.disabled = true);
                
                if(fSel.innerText === p.fonction) { ptsGained++; fSel.classList.add('correct'); } else fSel.classList.add('wrong');
                if(sSel.innerText === p.service) { ptsGained++; sSel.classList.add('correct'); } else sSel.classList.add('wrong');
                
                feedback = `Fonction : ${p.fonction} | Service : ${p.service}`;

            } else if (currentMode.id === 5 || currentMode.id === 6) {
                const isM5 = (currentMode.id === 5);
                const cards = document.querySelectorAll('.card-person');
                let expectedNum = parseInt(document.getElementById('question-display').dataset.corrects);
                
                cards.forEach(c => {
                    const id = parseInt(c.dataset.id);
                    const person = donneesAnnuaire.find(d => d.item.id === id).item;
                    const isExpected = isM5 ? (person.fonction+"|||"+person.service === target.val) : (person.service === target.val);
                    const isSelected = c.classList.contains('selected');
                    
                    if (isSelected && isExpected) { ptsGained++; c.classList.add('correct'); }
                    else if (isSelected && !isExpected) { c.classList.add('wrong'); }
                    else if (!isSelected && isExpected) { c.classList.add('missed'); }
                });
                if(expectedNum === 0 && ptsGained === 0) ptsGained = 1; 
                feedback = `Trouvé(s) : ${ptsGained} / ${expectedNum === 0 ? 1 : expectedNum}`;

            } else if (currentMode.id === 7) {
                const checks = document.querySelectorAll('input[type="checkbox"]');
                checks.forEach(c => c.disabled = true);
                
                checks.forEach(c => {
                    const id = parseInt(c.value);
                    const person = donneesAnnuaire.find(d => d.item.id === id).item;
                    const isExpected = (person.service === target.val);
                    const isSelected = c.checked;
                    
                    if (isSelected && isExpected) ptsGained++;
                    if(isExpected) c.parentElement.style.backgroundColor = "var(--success)";
                    if(isSelected && !isExpected) c.parentElement.style.backgroundColor = "var(--danger)";
                });
                feedback = `Points gagnés : ${ptsGained}`;
            }

            scoreSession += ptsGained;
            updateScoreDisplay();

            const fb = document.getElementById('feedback-container');
            fb.innerText = feedback;
            fb.className = "feedback-area " + (ptsGained > 0 ? "success" : "error");
            fb.classList.remove('hidden');

            document.getElementById('btn-next').classList.remove('hidden');
        }

        function nextQuestion() {
            currentIndex++;
            renderQuestion();
        }

        function updateScoreDisplay() {
            document.getElementById('current-score').innerText = scoreSession;
            document.getElementById('max-possible').innerText = maxPossibleSession;
        }

        window.onload = initMenu;
    </script>
</body>
</html>
