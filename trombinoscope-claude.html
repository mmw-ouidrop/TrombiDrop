<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trombinoscope — OUIDROP</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@400;600;700;800;900&family=Saira:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

  <style>
    :root {
      --white: #FFFFFF;
      --black: #000000;
      --navy: #20294E;
      --green: #43B38A;
      --blue-light: #82BEE9;
      --beige: #DDDABF;
      --pink: #FBE2EF;
      --coral: #EC7C7C;
      --bg: #F4F5F8;
      --surface: #FFFFFF;
      --surface2: #F0F2F7;
      --border: #DDE1EB;
      --text: #20294E;
      --text2: #5A6385;
      --text3: #9BA3BE;
      --success: #43B38A;
      --error: #EC7C7C;
      --radius: 12px;
      --radius-sm: 6px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Saira', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ===== HEADER ===== */
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 32px; height: 64px; background: var(--navy);
      position: sticky; top: 0; z-index: 100;
      box-shadow: 0 2px 12px rgba(32, 41, 78, 0.18);
    }

    .logo {
      font-family: 'Saira Condensed', sans-serif; font-size: 1.7rem; font-weight: 900;
      letter-spacing: 0.04em; color: var(--white); text-transform: uppercase;
    }

    .logo-sub {
      font-family: 'Saira', sans-serif; font-size: 0.65rem; font-weight: 400;
      letter-spacing: 0.22em; text-transform: uppercase; color: var(--green);
      margin-left: 2px; display: block; line-height: 1; margin-top: -4px;
    }

    .header-actions {
      display: flex; gap: 12px; align-items: center;
    }

    .header-btn {
      background: transparent; border: 1.5px solid rgba(255, 255, 255, 0.3);
      color: rgba(255, 255, 255, 0.85); padding: 7px 18px; border-radius: 50px;
      cursor: pointer; font-family: 'Saira', sans-serif; font-size: 0.82rem;
      font-weight: 500; letter-spacing: 0.04em; transition: all 0.2s; display: none;
    }

    .header-btn:hover { border-color: var(--green); color: var(--white); background: rgba(67, 179, 138, 0.15); }
    .header-btn.visible { display: block; }
    
    #btn-logout { border-color: rgba(236, 124, 124, 0.5); color: rgba(236, 124, 124, 0.9); }
    #btn-logout:hover { border-color: var(--error); background: rgba(236, 124, 124, 0.15); }

    /* ===== MAIN ===== */
    main { max-width: 980px; margin: 0 auto; padding: 40px 20px 80px; }

    /* ===== REUSABLE & ANIMATIONS ===== */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-up { animation: fadeUp 0.4s ease; }

    /* ===== LOGIN SCREEN ===== */
    #screen-login { display: block; }
    .login-card {
      background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius);
      padding: 40px; text-align: left; max-width: 450px; margin: 40px auto;
      box-shadow: 0 8px 28px rgba(32, 41, 78, 0.08);
    }
    
    .login-error-msg {
      color: var(--error); font-size: 0.85rem; font-weight: 600;
      margin-top: 8px; display: none;
    }

    /* ===== MENU ===== */
    #screen-menu { display: none; }
    .menu-eyebrow {
      font-family: 'Saira Condensed', sans-serif; font-size: 0.72rem; font-weight: 700;
      letter-spacing: 0.2em; text-transform: uppercase; color: var(--green); margin-bottom: 8px;
    }
    .menu-title {
      font-family: 'Saira Condensed', sans-serif; font-size: clamp(2.2rem, 5vw, 3.4rem);
      font-weight: 900; line-height: 1.05; text-transform: uppercase; letter-spacing: 0.02em;
      color: var(--navy); margin-bottom: 10px;
    }
    .menu-title em { color: var(--green); font-style: normal; }
    .menu-subtitle { color: var(--text2); font-size: 0.95rem; margin-bottom: 40px; font-weight: 400; }
    
    .modes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; }
    
    .mode-card {
      background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius);
      padding: 22px 22px 20px; cursor: pointer; transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative; overflow: hidden;
    }
    .mode-card::after {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
      background: var(--green); opacity: 0; transition: opacity 0.2s; border-radius: 2px 0 0 2px;
    }
    .mode-card:hover { transform: translateY(-3px); border-color: var(--green); box-shadow: 0 8px 28px rgba(32, 41, 78, 0.12); }
    .mode-card:hover::after { opacity: 1; }
    
    .mode-number { font-family: 'Saira Condensed', sans-serif; font-size: 0.65rem; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text3); margin-bottom: 8px; }
    .mode-name { font-family: 'Saira Condensed', sans-serif; font-size: 1.2rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.03em; color: var(--navy); margin-bottom: 5px; line-height: 1.2; }
    .mode-subtitle-text { font-size: 0.75rem; color: var(--text3); margin-bottom: 8px; font-weight: 500; }
    .mode-desc { font-size: 0.82rem; color: var(--text2); line-height: 1.5; }
    
    .mode-badge { display: inline-block; padding: 3px 10px; border-radius: 3px; font-family: 'Saira Condensed', sans-serif; font-size: 0.68rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; margin-top: 12px; }
    .badge-easy { background: rgba(67, 179, 138, 0.12); color: var(--green); border: 1px solid rgba(67, 179, 138, 0.3); }
    .badge-medium { background: rgba(130, 190, 233, 0.15); color: #3d89c7; border: 1px solid rgba(130, 190, 233, 0.4); }
    .badge-hard { background: rgba(236, 124, 124, 0.12); color: #c94f4f; border: 1px solid rgba(236, 124, 124, 0.3); }
    .badge-special { background: rgba(32, 41, 78, 0.08); color: var(--navy); border: 1px solid rgba(32, 41, 78, 0.18); }
    
    .mode-score { position: absolute; top: 14px; right: 14px; font-size: 0.68rem; font-weight: 600; color: var(--text3); background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; padding: 2px 8px; font-family: 'Saira', sans-serif; }
    .mode-score b { color: var(--navy); }

    /* ===== GAME SCREEN ===== */
    #screen-game { display: none; }
    .game-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; flex-wrap: wrap; gap: 12px; }
    .game-title { font-family: 'Saira Condensed', sans-serif; font-size: 1.45rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.03em; color: var(--navy); }
    
    .score-display { background: var(--navy); border-radius: 50px; padding: 8px 20px; font-family: 'Saira Condensed', sans-serif; font-size: 0.95rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: rgba(255, 255, 255, 0.7); }
    .score-display b { color: var(--green); font-size: 1.05rem; }

    .question-card { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 28px 30px; margin-bottom: 0; box-shadow: 0 2px 12px rgba(32, 41, 78, 0.05); }

    /* Photo */
    .photo-container { display: flex; justify-content: center; margin-bottom: 24px; }
    .avatar-wrap { width: 130px; height: 130px; border-radius: 50%; overflow: hidden; border: 3px solid var(--navy); box-shadow: 0 4px 20px rgba(32, 41, 78, 0.18); flex-shrink: 0; }
    .avatar-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .info-label { text-align: center; font-family: 'Saira Condensed', sans-serif; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--text3); margin-bottom: 6px; }

    /* QCM */
    .choices-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
    @media (max-width: 500px) { .choices-grid { grid-template-columns: 1fr; } }
    .choice-btn { background: var(--surface2); border: 1.5px solid var(--border); color: var(--text); padding: 13px 16px; border-radius: var(--radius-sm); cursor: pointer; font-family: 'Saira', sans-serif; font-size: 0.9rem; font-weight: 600; text-align: left; transition: all 0.16s; line-height: 1.35; }
    .choice-btn:hover:not(:disabled) { border-color: var(--navy); background: rgba(32, 41, 78, 0.05); }
    .choice-btn.selected { border-color: var(--navy); background: rgba(32, 41, 78, 0.07); }
    .choice-btn.correct { border-color: var(--green); background: rgba(67, 179, 138, 0.1); color: #1d7c5e; font-weight: 700; }
    .choice-btn.wrong { border-color: var(--error); background: rgba(236, 124, 124, 0.1); color: #a03030; }
    .choice-btn:disabled { cursor: default; }

    /* Inputs */
    .fields-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 18px; }
    .fields-grid.single { grid-template-columns: 1fr; }
    @media (max-width: 500px) { .fields-grid { grid-template-columns: 1fr; } }
    .field-wrap { display: flex; flex-direction: column; gap: 5px; }
    .field-wrap label { font-family: 'Saira Condensed', sans-serif; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text2); }
    .field-wrap input { background: var(--surface2); border: 1.5px solid var(--border); border-radius: var(--radius-sm); color: var(--text); padding: 11px 13px; font-family: 'Saira', sans-serif; font-size: 0.93rem; font-weight: 500; transition: border-color 0.18s; outline: none; width: 100%; box-sizing: border-box;}
    .field-wrap input:focus { border-color: var(--navy); background: white; }
    .field-wrap input.correct { border-color: var(--green); background: rgba(67, 179, 138, 0.06); }
    .field-wrap input.wrong { border-color: var(--error); background: rgba(236, 124, 124, 0.06); }
    .field-wrap input:disabled { opacity: 0.8; cursor: default; }
    .field-hint { font-size: 0.73rem; color: var(--green); margin-top: 2px; display: none; font-weight: 600; }
    .field-hint.wrong-hint { color: var(--error); }

    /* Buttons */
    .btn-primary { background: var(--navy); color: white; border: none; border-radius: var(--radius-sm); padding: 12px 28px; font-family: 'Saira Condensed', sans-serif; font-size: 0.95rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; transition: all 0.18s; margin-top: 18px; }
    .btn-primary:hover:not(:disabled) { background: #2d3868; transform: translateY(-1px); box-shadow: 0 4px 14px rgba(32, 41, 78, 0.25); }
    .btn-primary:disabled { opacity: 0.45; cursor: default; }
    .btn-primary.green { background: var(--green); }
    .btn-primary.green:hover:not(:disabled) { background: #3a9e7a; }
    .btn-primary.secondary { background: white; border: 1.5px solid var(--border); color: var(--text); }
    .btn-primary.secondary:hover:not(:disabled) { border-color: var(--navy); background: var(--surface2); }

    /* Feedback */
    .feedback-bar { border-radius: var(--radius-sm); padding: 12px 16px; font-size: 0.88rem; font-weight: 600; margin-top: 14px; display: none; align-items: center; gap: 10px; font-family: 'Saira', sans-serif; }
    .feedback-bar.show { display: flex; }
    .feedback-bar.good { background: rgba(67, 179, 138, 0.1); border: 1.5px solid var(--green); color: #1d7c5e; }
    .feedback-bar.bad { background: rgba(236, 124, 124, 0.1); border: 1.5px solid var(--error); color: #a03030; }

    /* Progress */
    .progress-wrap { margin-bottom: 24px; }
    .progress-info { display: flex; justify-content: space-between; font-size: 0.78rem; font-weight: 600; color: var(--text2); margin-bottom: 7px; font-family: 'Saira Condensed', sans-serif; letter-spacing: 0.06em; text-transform: uppercase; }
    .progress-bar { height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--green); border-radius: 3px; transition: width 0.4s ease; }

    /* Results */
    #screen-results { display: none; }
    .result-card { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 48px 40px; text-align: center; box-shadow: 0 4px 20px rgba(32, 41, 78, 0.08); }
    .result-score-big { font-family: 'Saira Condensed', sans-serif; font-size: 5.5rem; font-weight: 900; color: var(--navy); line-height: 1; margin: 16px 0 4px; letter-spacing: -0.01em; }
    .result-score-big span { color: var(--green); }
    .result-label { color: var(--text2); font-size: 0.88rem; margin-bottom: 6px; font-weight: 500; }
    .result-title { font-family: 'Saira Condensed', sans-serif; font-size: 1.4rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; color: var(--navy); margin-top: 6px; }
    .result-record { display: inline-block; margin-top: 12px; background: rgba(67, 179, 138, 0.1); border: 1px solid rgba(67, 179, 138, 0.3); border-radius: 4px; padding: 5px 14px; font-size: 0.8rem; font-weight: 700; color: #1d7c5e; font-family: 'Saira Condensed', sans-serif; letter-spacing: 0.08em; text-transform: uppercase; }
    .result-actions { display: flex; gap: 12px; justify-content: center; margin-top: 32px; flex-wrap: wrap; }

    /* Mode 4/5 dual */
    .dual-qcm { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 18px; }
    @media (max-width: 600px) { .dual-qcm { grid-template-columns: 1fr; } }
    .qcm-block h4 { font-family: 'Saira Condensed', sans-serif; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.14em; color: var(--text3); margin-bottom: 8px; }
    .qcm-block .choices-grid { grid-template-columns: 1fr; margin-top: 0; }

    /* Group cards */
    .group-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; margin-top: 18px; }
    .person-card { background: var(--surface2); border: 1.5px solid var(--border); border-radius: var(--radius-sm); padding: 14px 10px; cursor: pointer; transition: all 0.18s; text-align: center; }
    .person-card:hover:not(.locked) { border-color: var(--navy); background: rgba(32, 41, 78, 0.04); }
    .person-card.selected { border-color: var(--navy); background: rgba(32, 41, 78, 0.07); }
    .person-card.correct { border-color: var(--green); background: rgba(67, 179, 138, 0.1); }
    .person-card.wrong { border-color: var(--error); background: rgba(236, 124, 124, 0.08); }
    .person-card.missed { border-color: var(--green); border-style: dashed; opacity: 0.65; }
    .person-card.locked { cursor: default; }
    .person-card .avatar-sm { width: 58px; height: 58px; border-radius: 50%; overflow: hidden; margin: 0 auto 8px; border: 2px solid var(--border); }
    .person-card .avatar-sm img { width: 100%; height: 100%; object-fit: cover; }
    .person-card .p-name { font-size: 0.75rem; font-weight: 600; line-height: 1.3; color: var(--text); }

    /* Checkboxes */
    .checkbox-list { display: flex; flex-direction: column; gap: 7px; margin-top: 14px; }
    .checkbox-item { display: flex; align-items: center; gap: 12px; background: var(--surface2); border: 1.5px solid var(--border); border-radius: var(--radius-sm); padding: 11px 15px; cursor: pointer; transition: all 0.16s; }
    .checkbox-item:hover:not(.locked) { border-color: var(--navy); background: rgba(32, 41, 78, 0.04); }
    .checkbox-item.selected { border-color: var(--navy); background: rgba(32, 41, 78, 0.06); }
    .checkbox-item.correct { border-color: var(--green); background: rgba(67, 179, 138, 0.08); }
    .checkbox-item.wrong { border-color: var(--error); background: rgba(236, 124, 124, 0.07); }
    .checkbox-item.missed { border-color: var(--green); border-style: dashed; opacity: 0.65; }
    .checkbox-item.locked { cursor: default; }
    .checkbox-item input[type=checkbox] { accent-color: var(--navy); width: 16px; height: 16px; flex-shrink: 0; cursor: pointer; }
    .checkbox-item.locked input { cursor: default; }
    .cb-name { font-size: 0.9rem; font-weight: 500; color: var(--text); }

    /* Context strip */
    .context-strip { display: flex; align-items: center; gap: 20px; background: var(--navy); border-radius: var(--radius-sm); padding: 14px 20px; margin-bottom: 18px; flex-wrap: wrap; }
    .context-strip .label { font-family: 'Saira Condensed', sans-serif; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.14em; color: rgba(255, 255, 255, 0.5); margin-bottom: 2px; }
    .context-strip .value { font-family: 'Saira Condensed', sans-serif; font-size: 1.05rem; font-weight: 700; letter-spacing: 0.03em; color: white; }
    .context-sep { width: 1px; height: 32px; background: rgba(255, 255, 255, 0.15); flex-shrink: 0; }

    @keyframes pop {
      0% { transform: scale(1); }
      40% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
    .pop { animation: pop 0.28s ease; }
  </style>
</head>

<body>
  <div id="app">
    <header>
      <div>
        <div class="logo">OUIDROP</div>
        <span class="logo-sub">Drop &amp; Enjoy</span>
      </div>
      <div class="header-actions">
        <button id="btn-home" class="header-btn">← Menu</button>
        <button id="btn-logout" class="header-btn" onclick="logout()">Se déconnecter</button>
      </div>
    </header>
    <main>

      <div id="screen-login" class="fade-up">
        <div class="login-card">
            <p class="menu-eyebrow">Espace sécurisé</p>
            <h2 class="menu-title" style="font-size: 2.2rem; margin-bottom: 20px;">Connexion</h2>
            <div class="field-wrap">
                <label>Mot de passe OUIDROP</label>
                <input type="password" id="login-pwd" placeholder="Saisir le mot de passe..." onkeypress="if(event.key === 'Enter') handleLogin()" />
            </div>
            <p id="login-error" class="login-error-msg">⚠️ Mot de passe incorrect ou fichier altéré.</p>
            <button class="btn-primary" style="width: 100%; margin-top: 24px;" onclick="handleLogin()">Accéder au jeu</button>
        </div>
      </div>

      <div id="screen-menu" class="fade-up">
        <p class="menu-eyebrow">Jeu interne</p>
        <p class="menu-title">Mémorisez vos <em>collègues</em></p>
        <p class="menu-subtitle">Choisissez un mode d'entraînement pour progresser</p>
        <div class="modes-grid" id="modes-grid"></div>
      </div>

      <div id="screen-game" class="fade-up">
        <div class="game-header">
          <div class="game-title" id="game-title"></div>
          <div class="score-display">Score&nbsp;:&nbsp;<b id="score-live">0</b></div>
        </div>
        <div class="progress-wrap">
          <div class="progress-info">
            <span id="progress-text">Question 1 / ?</span>
            <span id="progress-pct">0%</span>
          </div>
          <div class="progress-bar">
            <div class="progress-fill" id="progress-fill" style="width:0%"></div>
          </div>
        </div>
        <div id="question-area"></div>
      </div>

      <div id="screen-results" class="fade-up">
        <div class="result-card">
          <p class="result-label">Partie terminée</p>
          <div class="result-title" id="res-mode-name"></div>
          <div class="result-score-big" id="res-score"></div>
          <p class="result-label">points sur <span id="res-max"></span></p>
          <div class="result-record" id="res-record" style="display:none"></div>
          <div class="result-actions">
            <button class="btn-primary secondary" id="btn-replay">Rejouer ce mode</button>
            <button class="btn-primary green" id="btn-back-menu">Menu principal</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    // ==========================================
    // DONNÉES ET SECURITE
    // ==========================================
    let donneesAnnuaire = [];
    let people = []; // Sera rempli UNIQUEMENT après le décryptage !
    let encryptedDataText = "";

    async function fetchEncryptedFile() {
      try {
        const response = await fetch('trombi_encrypted.txt');
        if (!response.ok) throw new Error("Fichier introuvable");
        encryptedDataText = await response.text();
        
        // Tentative d'auto-login si le mot de passe est enregistré
        const savedPwd = localStorage.getItem('ouidrop_pwd');
        if (savedPwd) {
            document.getElementById('login-pwd').value = savedPwd;
            handleLogin(true); // true = connexion automatique silencieuse
        }
      } catch (e) {
        console.error(e);
        document.getElementById('screen-login').innerHTML = `
          <div class="login-card" style="text-align: center; border-color: var(--error);">
            <h2 style="color:var(--error); font-family: 'Saira Condensed', sans-serif;">⚠️ Erreur critique</h2>
            <p style="color:var(--text2); margin-top: 10px;">Impossible de charger le fichier <b>trombi_encrypted.txt</b>. Assurez-vous qu'il est présent et que vous utilisez un serveur local (Live Server).</p>
          </div>`;
      }
    }

    function handleLogin(isAutoLogin = false) {
        const pwd = document.getElementById('login-pwd').value;
        const err = document.getElementById('login-error');
        
        if (!encryptedDataText) {
            if(!isAutoLogin) alert("Les données ne sont pas encore chargées. Vérifiez votre fichier.");
            return;
        }

        try {
            // Déchiffrement
            const bytes = CryptoJS.AES.decrypt(encryptedDataText.trim(), pwd);
            const decryptedText = bytes.toString(CryptoJS.enc.Utf8);
            
            if(!decryptedText) throw new Error("Mot de passe invalide");

            // Remplissage sécurisé des données
            donneesAnnuaire = JSON.parse(decryptedText);
            people = donneesAnnuaire.map(d => d.item); 
            
            // Succès
            localStorage.setItem('ouidrop_pwd', pwd);
            document.getElementById('screen-login').style.display = 'none';
            document.getElementById('btn-logout').classList.add('visible');
            renderMenu();

        } catch (error) {
            // Échec
            localStorage.removeItem('ouidrop_pwd');
            document.getElementById('login-pwd').value = "";
            if(!isAutoLogin) {
                err.style.display = 'block';
            }
        }
    }

    function logout() {
        localStorage.removeItem('ouidrop_pwd');
        donneesAnnuaire = [];
        people = [];

    function getAvatar(p) {
      if (p.picture) return p.picture;
      const initials = `${p.firstName.charAt(0)}${p.lastName.charAt(0)}`.toUpperCase();
      const colors = ['20294E', '2d3868', '1d7c5e', '3a7abf', '8b5a2b', '5a3e7a', '2d6e4e', '3d5a8a', '5e3a3a'];
      const color = colors[p.id % colors.length];
      return `https://ui-avatars.com/api/?name=${encodeURIComponent(initials)}&background=${color}&color=fff&size=200&bold=true&font-size=0.45`;
    }

    function avatarEl(p, size = 130) {
      const wrap = document.createElement('div');
      wrap.className = 'avatar-wrap fade-up';
      wrap.style.width = size + 'px';
      wrap.style.height = size + 'px';
      const img = document.createElement('img');
      img.src = getAvatar(p);
      img.alt = p.name;
      img.onerror = () => { img.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(p.firstName.charAt(0) + p.lastName.charAt(0))}&background=20294E&color=fff&size=200`; };
      wrap.appendChild(img);
      return wrap;
    }

    function normalize(s) {
      return s.toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/\s+/g, ' ').trim();
    }
    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[a[i], a[j]] = [a[j], a[i]]; }
      return a;
    }
    function pickOthers(exclude, pool, n) { return shuffle(pool.filter(p => p.id !== exclude.id)).slice(0, n); }
    function getScore(mode) { return parseInt(localStorage.getItem('trombi_oud_score_' + mode) || '0'); }
    function saveScore(mode, score) { const p = getScore(mode); if (score > p) localStorage.setItem('trombi_oud_score_' + mode, score); }
    function parseBirthDate(iso) {
      if(!iso) return "";
      const d = new Date(iso);
      return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}`;
    }

    // ==========================================
    // BUILD QUESTIONS
    // ==========================================
    function buildQuestions(mode) {
      const pool = shuffle(people); const qs = [];
      if (mode === 1 || mode === 2) {
        pool.forEach(p => {
          const choices = shuffle([p, ...pickOthers(p, people, 3)]);
          qs.push({ person: p, choices, maxPts: mode === 1 ? 10 : 20 });
        });
      } else if (mode === 3) {
        pool.forEach(p => qs.push({ person: p, maxPts: 50 }));
      } else if (mode === 4) {
        pool.forEach(p => {
          const fonctions = [p.fonction, ...shuffle(people.filter(x => x.fonction !== p.fonction).map(x => x.fonction).filter((v, i, a) => a.indexOf(v) === i)).slice(0, 3)];
          const services = [p.service, ...shuffle(people.filter(x => x.service !== p.service).map(x => x.service).filter((v, i, a) => a.indexOf(v) === i)).slice(0, 3)];
          qs.push({ person: p, fonctionChoices: shuffle(fonctions), serviceChoices: shuffle(services), maxPts: 20 });
        });
      } else if (mode === 5) {
        const fonctions = [...new Set(people.map(p => p.fonction))];
        shuffle(fonctions).forEach(fn => {
          const correct = people.filter(p => p.fonction === fn);
          const wrong = shuffle(people.filter(p => p.fonction !== fn)).slice(0, Math.max(3, 6 - correct.length));
          qs.push({ fonction: fn, service: correct[0].service, correct, displayed: shuffle([...correct, ...wrong]), maxPts: correct.length * 10 });
        });
      } else if (mode === 6) {
        const services = [...new Set(people.map(p => p.service))];
        shuffle(services).forEach(sv => {
          const correct = people.filter(p => p.service === sv);
          const wrong = shuffle(people.filter(p => p.service !== sv)).slice(0, Math.max(3, 8 - correct.length));
          qs.push({ service: sv, correct, displayed: shuffle([...correct, ...wrong]), maxPts: correct.length * 10 });
        });
      } else if (mode === 7) {
        const services = [...new Set(people.map(p => p.service))];
        shuffle(services).forEach(sv => {
          const correct = people.filter(p => p.service === sv);
          qs.push({ service: sv, correct, displayed: shuffle([...people]), maxPts: correct.length * 10 });
        });
      }
      return qs;
    }

      const area = document.getElementById('question-area');
      area.innerHTML = '';

      card.className = 'question-card fade-up';
      if (currentMode === 1) renderMode1(card, q);
      else if (currentMode === 2) renderMode2(card, q);
      else if (currentMode === 3) renderMode3(card, q);
      else if (currentMode === 4) renderMode4(card, q);
      else if (currentMode === 5) renderMode5(card, q);
      else if (currentMode === 6) renderMode6(card, q);
      else if (currentMode === 7) renderMode7(card, q);
      area.appendChild(card);
    }

    function buildGroupCards(card, q, type) {
      const grid = document.createElement('div'); grid.className = 'group-grid fade-up';
      const selected = new Set();
      q.displayed.forEach(p => {
        const pc = document.createElement('div'); pc.className = 'person-card'; pc.dataset.id = p.id;
        const aw = document.createElement('div'); aw.className = 'avatar-sm';
        const img = document.createElement('img'); img.src = getAvatar(p); img.alt = p.name; aw.appendChild(img); pc.appendChild(aw);
        const nm = document.createElement('div'); nm.className = 'p-name'; nm.textContent = `${p.firstName} ${p.lastName}`; pc.appendChild(nm);
        pc.onclick = () => {
          if (answered || pc.classList.contains('locked')) return;
          if (selected.has(p.id)) { selected.delete(p.id); pc.classList.remove('selected'); }
          else { selected.add(p.id); pc.classList.add('selected'); }
        };
        grid.appendChild(pc);
      });
      card.appendChild(grid);
      const valBtn = document.createElement('button'); valBtn.className = 'btn-primary fade-up'; valBtn.textContent = 'Valider';
      valBtn.onclick = () => {
        if (answered) return; answered = true;
        const correctIds = new Set(q.correct.map(p => p.id)); let pts = 0;
        grid.querySelectorAll('.person-card').forEach(pc => {
          pc.classList.add('locked');
          const id = parseInt(pc.dataset.id), isC = correctIds.has(id), isS = selected.has(id);
          if (isC && isS) { pc.classList.add('correct'); pts += 10; }
          else if (!isC && isS) { pc.classList.add('wrong'); pts -= 5; }
          else if (isC && !isS) pc.classList.add('missed');
          pc.classList.remove('selected');
        });
        pts = Math.max(0, pts); valBtn.disabled = true; addScore(pts);
        showFeedback(card, pts === q.maxPts, `+${pts} pts — ${q.correct.length} personne(s) attendue(s)`, pts, q.maxPts); nextBtn(card);
      };
      card.appendChild(valBtn);
    }

    function styleField(inputId, hintId, ok, correctVal) {
      const inp = document.getElementById(inputId), hint = document.getElementById(hintId);
      inp.classList.add(ok ? 'correct' : 'wrong');

    function showFeedback(card, good, msg, pts, max) {
      const fb = document.createElement('div');
      fb.className = `feedback-bar ${good ? 'good' : 'bad'} show fade-up`;
      fb.innerHTML = `<span style="font-size:1rem">${good ? '✅' : '❌'}</span> ${msg}`;
      card.appendChild(fb);
    }
    function addScore(pts) {
      score += pts;
      document.getElementById('score-live').textContent = score;
      const el = document.getElementById('score-live');
      el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
    }
    function nextBtn(card) {
      const isLast = qIndex >= questions.length - 1;
      const btn = document.createElement('button'); btn.className = 'btn-primary green fade-up'; btn.style.marginLeft = '12px';
      btn.textContent = isLast ? 'Voir les résultats →' : 'Question suivante →';
      btn.onclick = () => { qIndex++; showQuestion(); };
      card.appendChild(btn);
    }

    // ==========================================
    // RESULTS
    // ==========================================
    function showResults() {
      saveScore(currentMode, score);
      document.getElementById('screen-game').style.display = 'none';
      document.getElementById('screen-results').style.display = 'block';
      const m = MODES.find(x => x.id === currentMode);
      document.getElementById('res-mode-name').textContent = m.name;
      document.getElementById('res-score').innerHTML = `${score} <span>/ ${maxScore}</span>`;
      document.getElementById('res-max').textContent = maxScore;
      const best = getScore(currentMode);
      const rec = document.getElementById('res-record');
      if (score > 0 && score === best) { rec.textContent = '🏆 Nouveau record personnel !'; rec.style.display = 'inline-block'; }
      else if (best > 0) { rec.textContent = `Record : ${best} pts`; rec.style.display = 'inline-block'; }
    }

    // ==========================================
    // EVENTS
    // ==========================================
    document.getElementById('btn-home').onclick = () => renderMenu();
    document.getElementById('btn-back-menu').onclick = () => renderMenu();
    document.getElementById('btn-replay').onclick = () => startMode(currentMode);
  </script>
</body>

</html>
